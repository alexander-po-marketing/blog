[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "divi2gutenberg"
version = "0.1.0"
description = "Convert Divi Builder shortcodes in WordPress WXR exports into Gutenberg block markup."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "OpenAI Codex"}]
dependencies = [
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]

[project.scripts]
divi2gutenberg = "divi2gutenberg.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
